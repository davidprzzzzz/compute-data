name: fetch

on:
  schedule:
    - cron: "17 5 * * *"   # tous les jours, 05:17 UTC (06:17 Paris)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["fetch.py", "build.py", ".github/workflows/fetch.yml"]

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collecte
        run: python fetch.py
      - name: Construction des fichiers du dashboard
        run: python build.py
      - name: Commit
        run: |
          git config user.name "compute-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data dash
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git pull --rebase -X theirs origin main
          git push
