name: fetch

on:
  schedule:
    - cron: "17 */4 * * *"   # toutes les 4 heures (01:17, 05:17, 09:17... UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["fetch.py", "build.py", "build_site.py", "site/**", ".github/workflows/fetch.yml"]

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collecte
        run: python fetch.py
      - name: Construction des fichiers du dashboard
        run: python build.py
      - name: Commit
        run: |
          git config user.name "compute-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data dash
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git pull --rebase -X theirs origin main
          git push
      - name: Site autonome
        run: python build_site.py
      - name: Vérification du jeton Cloudflare
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          tok, acc = os.environ["CLOUDFLARE_API_TOKEN"].strip(), os.environ["CLOUDFLARE_ACCOUNT_ID"].strip()
          def get(path):
              req = urllib.request.Request("https://api.cloudflare.com/client/v4" + path, headers={"Authorization": "Bearer " + tok})
              try:
                  return json.load(urllib.request.urlopen(req, timeout=30))
              except urllib.error.HTTPError as e:
                  return json.load(e)
          v = get("/user/tokens/verify")
          print("jeton utilisateur valide :", v.get("success"), (v.get("result") or {}).get("status"))
          a = get("/accounts?per_page=50")
          ids = [x["id"] for x in a.get("result") or []]
          print("comptes visibles par le jeton :", len(ids), "; account id du secret parmi eux :", acc in ids)
          if acc not in ids and len(ids) == 1:
              acc = ids[0]
              print("::add-mask::" + acc)
              print("account id corrigé : celui du seul compte visible par le jeton")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("CF_ACCOUNT=" + acc + "\n")
          p = get(f"/accounts/{acc}/pages/projects")
          print("accès Pages :", p.get("success"), p.get("errors"))
          PY
      - name: Publication Cloudflare Pages
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          export CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT"
          npx --yes wrangler@4 pages project create compute-desk --production-branch=main || true
          npx --yes wrangler@4 pages deploy site --project-name=compute-desk --branch=main --commit-dirty=true
